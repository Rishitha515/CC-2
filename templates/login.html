<!DOCTYPE html>
<html>
<head>
    <title>Re-Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #eef2f7, #f8fafc);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 450px;
            background: white;
            padding: 32px;
            margin: auto;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #1f2d3d;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d6dbe3;
            border-radius: 8px;
            box-sizing: border-box;
            background: #fafbfd;
        }

        input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
            background: white;
        }

        button {
            width: 100%;
            margin-top: 18px;
            background: #16a34a;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Re-Login</h2>
        <form action="/relogin" method="POST">
            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
